services:
  - type: web
    name: monitoramento-iot-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: virginia
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: monitoramento-iot-db
          property: connectionString
      - key: DEVICE_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_USER
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: DEMO_DEVICE_ID
        value: esp32c3-01
      - key: THINGSPEAK_WRITE_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.5-flash-lite

databases:
  - name: monitoramento-iot-db
    databaseName: iot_monitor
    user: iot_app
    plan: free
    region: virginia
