<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Microclimate Monitor</title>
  <style>
    body{font:16px system-ui,sans-serif;background:#f2f5f8;color:#183047;margin:0;padding:2rem}
    main{max-width:760px;margin:auto}.card{background:white;padding:1.5rem;border-radius:14px;box-shadow:0 4px 20px #18304718}
    label,input,button{display:block;margin:.5rem 0}input{padding:.7rem;max-width:100%;width:22rem}button{padding:.7rem 1rem}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.metric{font-size:2rem;font-weight:700}
    #status{color:#586c7b}.error{color:#a12622}@media(max-width:560px){.grid{grid-template-columns:1fr}body{padding:1rem}}
  </style>
</head>
<body><main>
  <h1>Microclimate Monitor</h1>
  <section class="card">
    <p>Sign in to view the latest reading stored by the project API.</p>
    <form id="login"><label>Username<input name="username" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button>Sign in</button></form>
    <p id="status" role="status">Not connected</p>
  </section>
  <section class="grid" aria-live="polite">
    <article class="card"><h2>Temperature</h2><p class="metric" id="temperature">—</p></article>
    <article class="card"><h2>Humidity</h2><p class="metric" id="humidity">—</p></article>
  </section>
  <section class="card"><h2>Latest record</h2><p id="details">Sign in to load data.</p></section>
</main>
<script>
  let token='';
  let refreshTimer=0;
  const status=document.querySelector('#status');
  document.querySelector('#login').addEventListener('submit',async event=>{
    event.preventDefault(); status.textContent='Signing in…';
    const data=Object.fromEntries(new FormData(event.currentTarget));
    try{
      const response=await fetch('/api/v1/auth/token',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});
      const body=await response.json(); if(!response.ok) throw new Error(body.error||'Sign-in failed');
      token=body.access_token; await refresh();
      if(refreshTimer) clearInterval(refreshTimer);
      refreshTimer=setInterval(()=>refresh().catch(error=>{
        status.textContent=error.message; status.className='error';
      }),5000);
    }catch(error){status.textContent=error.message;status.className='error';}
  });
  async function refresh(){
    const response=await fetch('/api/v1/readings/latest',{headers:{authorization:`Bearer ${token}`}});
    const body=await response.json(); if(!response.ok) throw new Error(body.error||'Could not load readings');
    const r=body.reading;
    if(!r){status.textContent='No readings have reached the API yet.';return;}
    document.querySelector('#temperature').textContent=`${Number(r.temperature_c).toFixed(1)} °C`;
    document.querySelector('#humidity').textContent=`${Number(r.humidity_percent).toFixed(1)} %`;
    document.querySelector('#details').textContent=`Device ${r.device_id}, sequence ${r.sequence}, ${new Date(r.timestamp).toLocaleString()}`;
    status.textContent='Connected'; status.className='';
  }
</script>
</body></html>
