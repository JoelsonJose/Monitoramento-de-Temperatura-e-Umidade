<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Monitoramento de Temperatura e Umidade</title>
  <style>
    body{font:16px system-ui,sans-serif;background:#f2f5f8;color:#183047;margin:0;padding:2rem}
    main{max-width:760px;margin:auto}.card{background:white;padding:1.5rem;border-radius:14px;box-shadow:0 4px 20px #18304718}
    label,input,button{display:block;margin:.5rem 0}input{padding:.7rem;max-width:100%;width:22rem}button{padding:.7rem 1rem}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.metric{font-size:2rem;font-weight:700}
    #status{color:#586c7b}.error{color:#a12622}@media(max-width:560px){.grid{grid-template-columns:1fr}body{padding:1rem}}
  </style>
</head>
<body><main>
  <h1>Monitoramento de temperatura e umidade</h1>
  <section class="card">
    <p>Entre para consultar a leitura mais recente armazenada pela API do projeto.</p>
    <form id="login"><label>Usuário<input name="username" autocomplete="username" required></label>
      <label>Senha<input name="password" type="password" autocomplete="current-password" required></label>
      <button>Entrar</button></form>
    <p id="status" role="status">Desconectado</p>
  </section>
  <section class="grid" aria-live="polite">
    <article class="card"><h2>Temperatura</h2><p class="metric" id="temperature">—</p></article>
    <article class="card"><h2>Umidade</h2><p class="metric" id="humidity">—</p></article>
  </section>
  <section class="card"><h2>Último registro</h2><p id="details">Entre para carregar os dados.</p><p id="last-contact">Último contato do dispositivo: —</p></section>
</main>
<script>
  let token='';
  let refreshTimer=0;
  const status=document.querySelector('#status');
  document.querySelector('#login').addEventListener('submit',async event=>{
    event.preventDefault(); status.textContent='Entrando…';
    const data=Object.fromEntries(new FormData(event.currentTarget));
    try{
      const response=await fetch('/api/v1/auth/token',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});
      const body=await response.json(); if(!response.ok) throw new Error(translateError(body.error)||'Falha ao entrar.');
      token=body.access_token; await refresh();
      if(refreshTimer) clearInterval(refreshTimer);
      refreshTimer=setInterval(()=>refresh().catch(error=>{
        status.textContent=error.message; status.className='error';
      }),5000);
    }catch(error){status.textContent=error.message;status.className='error';}
  });
  function translateError(message){
    const messages={
      'Invalid credentials':'Usuário ou senha inválidos.',
      'User authentication is not configured':'O acesso de usuário não está configurado.',
      'Bearer token required or expired':'Sessão expirada. Entre novamente.',
      'Could not load readings':'Não foi possível carregar as leituras.',
      'Device not found or access denied':'Dispositivo não encontrado ou acesso não autorizado.'
    };
    return messages[message]||message;
  }
  async function refresh(){
    const response=await fetch('/api/v1/readings/latest',{headers:{authorization:`Bearer ${token}`}});
    const body=await response.json(); if(!response.ok) throw new Error(translateError(body.error)||'Não foi possível carregar as leituras.');
    const r=body.reading;
    if(!r){status.textContent='Nenhuma leitura chegou à API ainda.';return;}
    document.querySelector('#temperature').textContent=`${Number(r.temperature_c).toFixed(1)} °C`;
    document.querySelector('#humidity').textContent=`${Number(r.humidity_percent).toFixed(1)} %`;
    document.querySelector('#details').textContent=`Dispositivo ${r.device_id}, sequência ${r.sequence}, ${new Date(r.timestamp).toLocaleString('pt-BR')}`;
    document.querySelector('#last-contact').textContent=`Último contato do dispositivo: ${r.last_seen_at ? new Date(r.last_seen_at).toLocaleString('pt-BR') : 'não informado'}`;
    status.textContent='Conectado'; status.className='';
  }
</script>
</body></html>
